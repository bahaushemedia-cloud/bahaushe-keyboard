name: Build BAHAUSHE Keyboard Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Keyman compiler
        run: npm install -g @keymanapp/kmc

      - name: Compile keyboard
        run: kmc build bahaushe.kmn

      - name: List compiled files
        run: ls -la

      - name: Build .kmp package manually
        run: |
          mkdir -p package
          cp bahaushe.kmx package/
          cp bahaushe.js package/
          cp bahaushe.keyman-touch-layout package/
          cp BAHAUSHE.otf package/
          cp kmp.json package/
          cd package && zip -r ../bahaushe.kmp .

      - name: Upload .kmp as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bahaushe-keyboard-package
          path: bahaushe.kmp
          retention-days: 90
